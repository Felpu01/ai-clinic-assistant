<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Clinic Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
        }

        .card h2 {
            margin: 0;
            font-size: 32px;
        }

        .card p {
            margin-top: 10px;
            color: #94a3b8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
        }

        th {
            background: #334155;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-top: 1px solid #334155;
        }

        .hot {
            color: #22c55e;
            font-weight: bold;
        }

        .warm {
            color: #facc15;
            font-weight: bold;
        }

        .cold {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🚀 AI Clinic Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h2 id="total">0</h2>
            <p>Total Leads</p>
        </div>

        <div class="card">
            <h2 id="hot">0</h2>
            <p>Hot Leads</p>
        </div>

        <div class="card">
            <h2 id="warm">0</h2>
            <p>Warm Leads</p>
        </div>

        <div class="card">
            <h2 id="cold">0</h2>
            <p>Cold Leads</p>
        </div>

    </div>

    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Message</th>
                <th>Type</th>
                <th>Score</th>
                <th>Stage</th>
            </tr>
        </thead>

        <tbody id="leadsTable"></tbody>
    </table>

    <!-- ✅ SAAS ARCHITECTURE CHANGE: JS SEPARADO -->
    <script src="/static/dashboard.js"></script>

</body>

</html>
