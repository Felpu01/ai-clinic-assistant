<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Clinic SaaS Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 { margin-bottom: 5px; }
        .subtitle { color: #94a3b8; margin-bottom: 20px; }

        .plan-bar {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-info { font-size: 14px; color: #94a3b8; }

        .upgrade-btn {
            background: #22c55e;
            color: black;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .upgrade-btn:hover { background: #16a34a; }

        .cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
        }

        .card h2 { margin: 0; font-size: 28px; }
        .card p { margin-top: 10px; color: #94a3b8; }

        .demo-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .demo-box input {
            width: 70%;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        .demo-box button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            cursor: pointer;
            font-weight: bold;
        }

        .demo-response { margin-top: 10px; color: #94a3b8; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 30px;
        }

        th {
            background: #334155;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-top: 1px solid #334155;
        }

        .pricing {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            margin-top: 30px;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .price-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .highlight { border: 2px solid #22c55e; }
    </style>
</head>

<body>

    <h1>🚀 AI Clinic SaaS</h1>
    <div class="subtitle">Sistema de conversión de pacientes en tiempo real</div>

    <!-- PLAN -->
    <div class="plan-bar">
        <div>
            <div><strong id="plan">FREE</strong> plan</div>
            <div class="plan-info" id="usage">0 / 0 leads usados</div>
        </div>

        <div>
            <button class="upgrade-btn" onclick="buyPlan('BASIC')">Upgrade BASIC</button>
            <button class="upgrade-btn" style="margin-left:10px;background:#a855f7;color:white;" onclick="buyPlan('PRO')">Upgrade PRO</button>
        </div>
    </div>

    <!-- KPI -->
    <div class="cards">
        <div class="card"><h2 id="total">0</h2><p>Total Leads</p></div>
        <div class="card"><h2 id="hot">0</h2><p>Hot</p></div>
        <div class="card"><h2 id="warm">0</h2><p>Warm</p></div>
        <div class="card"><h2 id="cold">0</h2><p>Cold</p></div>
        <div class="card"><h2 id="conversion">0%</h2><p>Conversion</p></div>
    </div>

    <!-- DEMO -->
    <div class="demo-box">
        <h3>🧪 IA Demo</h3>
        <input id="demoInput" placeholder="Escribe mensaje...">
        <button onclick="sendDemo()">Probar</button>
        <div class="demo-response" id="demoResponse"></div>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Message</th>
                <th>Type</th>
                <th>Score</th>
                <th>Stage</th>
            </tr>
        </thead>
        <tbody id="leadsTable"></tbody>
    </table>

    <!-- PRICING -->
    <div class="pricing">
        <h3>💰 Planes</h3>

        <div class="pricing-grid">
            <div class="price-card">
                <h4>FREE</h4>
                <p>50 leads</p>
            </div>

            <div class="price-card">
                <h4>BASIC</h4>
                <p>300 leads</p>
            </div>

            <div class="price-card highlight">
                <h4>PRO</h4>
                <p>Ilimitado</p>
            </div>
        </div>
    </div>

    <!-- STRIPE -->
    <script>
        async function buyPlan(plan) {
            const res = await fetch("/create-checkout-session", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ plan })
            });

            const data = await res.json();

            if (data.url) {
                window.location.href = data.url;
            } else {
                alert("Error Stripe");
            }
        }
    </script>

    <script src="/static/dashboard.js"></script>

</body>

</html>
