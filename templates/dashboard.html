<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Clinic SaaS Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* ---------------- CARDS ---------------- */
        .cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card h2 {
            margin: 0;
            font-size: 28px;
        }

        .card p {
            margin-top: 10px;
            color: #94a3b8;
        }

        /* ---------------- FUNNEL ---------------- */
        .funnel {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .funnel h3 {
            margin-top: 0;
        }

        .funnel-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .step {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            font-size: 14px;
        }

        .cold { background: #0ea5e9; }
        .warm { background: #facc15; color: black; }
        .hot { background: #22c55e; }

        /* ---------------- TABLE ---------------- */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
        }

        th {
            background: #334155;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-top: 1px solid #334155;
        }

        .tag-hot {
            color: #22c55e;
            font-weight: bold;
        }

        .tag-warm {
            color: #facc15;
            font-weight: bold;
        }

        .tag-cold {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🚀 AI Clinic SaaS</h1>
    <div class="subtitle">Dashboard de conversión de leads en tiempo real</div>

    <!-- KPI CARDS -->
    <div class="cards">

        <div class="card">
            <h2 id="total">0</h2>
            <p>Total Leads</p>
        </div>

        <div class="card">
            <h2 id="hot">0</h2>
            <p>🔥 Hot Leads</p>
        </div>

        <div class="card">
            <h2 id="warm">0</h2>
            <p>🟡 Warm Leads</p>
        </div>

        <div class="card">
            <h2 id="cold">0</h2>
            <p>🔵 Cold Leads</p>
        </div>

        <div class="card">
            <h2 id="conversion">0%</h2>
            <p>📈 Conversion Rate</p>
        </div>

    </div>

    <!-- FUNNEL VISUAL -->
    <div class="funnel">
        <h3>Lead Funnel</h3>
        <div class="funnel-bar">
            <div class="step cold">Cold</div>
            <div class="step warm">Warm</div>
            <div class="step hot">Hot</div>
        </div>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Message</th>
                <th>Type</th>
                <th>Score</th>
                <th>Stage</th>
            </tr>
        </thead>

        <tbody id="leadsTable"></tbody>
    </table>

    <script src="/static/dashboard.js"></script>

</body>

</html>
